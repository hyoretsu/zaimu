name: zaimu

services:
  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    profiles: [local]
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
  redis:
    image: redis:8.2-alpine
    profiles: [local]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lfu"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    volumes:
      - redis-data:/data
  migrations:
    image: ghcr.io/hyoretsu/zaimu_backend:latest
    env_file: .env
    working_dir: /app/packages/sql
    command: ["bun", "run", "migrate:deploy"]
    networks:
      - postgres
    restart: "no"

  backend:
    image: ghcr.io/hyoretsu/zaimu_backend:latest
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: .env
    networks:
      - postgres
      - proxy
    restart: always
    labels:
      caddy: api.zaimu.hyoretsu.com
      caddy.reverse_proxy: "{{upstreams 3333}}"

  worker:
    image: ghcr.io/hyoretsu/zaimu_worker:latest
    depends_on:
      migrations:
        condition: service_completed_successfully
    env_file: .env
    networks:
      - postgres
    restart: always

  frontend:
    image: ghcr.io/hyoretsu/zaimu_frontend:latest
    depends_on:
      - backend
    env_file: .env
    networks:
      - postgres
      - proxy
    restart: always
    labels:
      caddy: zaimu.hyoretsu.com
      caddy.reverse_proxy: "{{upstreams 3000}}"

networks:
  postgres:
    external: true
  proxy:
    external: true
volumes:
  rabbitmq-data:
  redis-data:
