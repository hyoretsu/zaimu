global:
  scrape_interval: 15s
rule_files: [alerts.yaml]
scrape_configs:
  - job_name: application
    static_configs:
      - targets: [collector:8889]
  - job_name: collector
    static_configs:
      - targets: [collector:8888]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
