name: CD - images

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Images to publish
        type: choice
        options: [all, backend, worker, frontend]
        default: all

permissions:
  contents: read

# Finish the current publication before starting another on the same branch.
# Do not cancel a run midway through updating mutable image tags.
concurrency:
  group: cd-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile --ignore-scripts
      - name: Compute affected packages
        id: affected
        env:
          BASE_SHA: ${{ github.event.before }}
        run: echo "tasks=$(bun scripts/affected-packages.ts "$BASE_SHA" build)" >> "$GITHUB_OUTPUT"
      - name: Plan image matrix
        id: plan
        env:
          TASKS: ${{ steps.affected.outputs.tasks }}
          TARGET: ${{ inputs.target || 'affected' }}
        run: python .github/scripts/plan-cd.py

  images:
    name: Image / ${{ matrix.service }}${{ matrix.variant.suffix }}
    needs: detect
    if: needs.detect.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Validate production web URLs
        if: matrix.service == 'frontend'
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_APP_URL: ${{ vars.VITE_APP_URL }}
        run: python .github/scripts/validate-build-urls.py
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Image metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/${{ github.repository }}_${{ matrix.service }}${{ matrix.variant.suffix }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,format=long
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NODE_ENV=production
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_APP_URL=${{ vars.VITE_APP_URL }}
            VARIANT=${{ matrix.variant.slug }}
            BRANDING_REVISION=${{ github.run_id }}-${{ github.run_attempt }}
          secrets: DATABASE_URL=${{ secrets.DATABASE_URL }}
          cache-from: type=gha,scope=${{ matrix.service }}${{ matrix.variant.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}${{ matrix.variant.suffix }}
      - name: Publication summary
        env:
          IMAGE: ghcr.io/${{ github.repository }}_${{ matrix.service }}${{ matrix.variant.suffix }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: printf 'Published `%s@%s` from `%s`\n' "$IMAGE" "$DIGEST" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
