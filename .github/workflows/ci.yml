name: CI

on:
  pull_request:

jobs:
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    outputs:
      tasks: ${{ steps.affected.outputs.tasks }}
      test-matrix: ${{ steps.test-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # Need the base commit present to diff the PR against it.
          fetch-depth: 0

      - name: Compute affected packages
        id: affected
        uses: hyoretsu/gh-actions/detect-affected@main
        with:
          tasks: check-types build test:unit test:integration test:e2e
          base-sha: ${{ github.event.pull_request.base.sha }}

      - name: Build test matrix
        id: test-matrix
        env:
          TASKS: ${{ steps.affected.outputs.tasks }}
        run: |
          node -e 'const tasks = JSON.parse(process.env.TASKS); const matrix = ["unit", "integration", "e2e"].flatMap(category => (tasks[`test:${category}`] ?? []).map(pkg => ({ package: pkg, category }))); require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `matrix=${JSON.stringify(matrix)}\n`);'

  build:
    name: "${{ matrix.package }} / Build"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['build'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build
        uses: hyoretsu/gh-actions/build@main
        with:
          package: ${{ matrix.package }}

  android:
    name: "frontend / Android build"
    needs: detect
    if: contains(fromJSON(needs.detect.outputs.tasks)['build'], 'frontend')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Android app (debug, unsigned)
        uses: hyoretsu/gh-actions/tauri-android-build@main
        with:
          args: --debug --apk

  check-types:
    name: "${{ matrix.package }} / Type-check"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.detect.outputs.tasks)['check-types'] }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Check types
        uses: hyoretsu/gh-actions/check-types@main
        with:
          package: ${{ matrix.package }}

  tests:
    if: needs.detect.outputs.test-matrix != '[]'
    name: "${{ matrix.package }} / ${{ matrix.category }} tests"
    needs: detect
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.test-matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check shared runner types and failure regressions
        if: matrix.package == 'backend' && matrix.category == 'unit'
        run: |
          bun x --no-install tsc --noEmit --project scripts/tsconfig.json
          bun run test:runner

      - name: Prepare local disposable service images
        if: matrix.category != 'unit'
        run: |
          docker pull postgres:16
          docker pull valkey/valkey:latest
          docker pull rabbitmq:latest

      - name: Run tests
        run: bun run --filter '${{ matrix.package }}' 'test:${{ matrix.category }}'
