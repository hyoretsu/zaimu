name: CD - apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platform:
        description: Platforms to build (publishing requires all)
        type: choice
        options: [all, desktop, android, ios]
        default: all
      publish:
        description: Publish complete release (select its existing version tag as ref)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd-apps-${{ github.ref }}
  cancel-in-progress: false

env:
  VITE_API_URL: ${{ vars.VITE_API_URL }}
  VITE_APP_URL: ${{ vars.VITE_APP_URL }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  # Pin compiler and Bun (packageManager) for every platform.
  RUST_TOOLCHAIN: '1.95.0'
  ANDROID_TARGET_SDK: '36'

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      variants: ${{ steps.plan.outputs.variants }}
      publish: ${{ steps.plan.outputs.publish }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      name: ${{ steps.plan.outputs.name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Plan platforms and validate release version
        id: plan
        env:
          CD_MODE: apps
          PLATFORM: ${{ inputs.platform || 'all' }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: python .github/scripts/plan-cd.py
      - name: Validate production web URLs
        run: python .github/scripts/validate-build-urls.py
      - name: Validate Android release signing
        env:
          PUBLISH: ${{ steps.plan.outputs.publish }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          python - <<'PYTHON'
          import os
          if os.environ['PUBLISH'] == 'true':
              for key in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_KEYSTORE_PASSWORD', 'ANDROID_KEY_ALIAS'):
                  if not os.environ[key]:
                      raise SystemExit(f'{key} required for a signed Android release')
          PYTHON
      - name: Reject an already published version
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.plan.outputs.tag }}
        run: |
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases" > "$RUNNER_TEMP/releases.json"
          python - <<'PYTHON'
          import json, os
          from pathlib import Path
          for release in (r for page in json.loads((Path(os.environ['RUNNER_TEMP']) / 'releases.json').read_text()) for r in page):
              if release['tag_name'] == os.environ['TAG'] and not release['draft']:
                  raise SystemExit('Version already published; bump native version and create a new tag')
          PYTHON

  native:
    name: App / ${{ matrix.platform }}${{ matrix.variant.suffix }}
    needs: plan
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      VARIANT: ${{ matrix.variant.slug }}
      CARGO_TARGET_DIR: ${{ github.workspace }}/frontend/src-tauri/target
      PLATFORM: ${{ matrix.platform }}
      EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: frontend/src-tauri -> target
          key: ${{ matrix.platform }}${{ matrix.variant.suffix }}
      - name: Linux native dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.kind == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        if: matrix.kind == 'android'
        with:
          packages: platform-tools
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Build web assets and generated contracts
        run: |
          mkdir -p backend/static
          bun turbo run build --filter frontend --env-mode=loose
      - name: Build native app
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          APPLE_DEVELOPMENT_TEAM: ${{ vars.APPLE_DEVELOPMENT_TEAM }}
          IOS_CERTIFICATE: ${{ secrets.IOS_CERTIFICATE }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_MOBILE_PROVISION: ${{ secrets.IOS_MOBILE_PROVISION }}
        run: python .github/scripts/build-native.py
      - name: Upload installers and build metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-${{ matrix.platform }}${{ matrix.variant.suffix }}
          path: native-artifacts/
          if-no-files-found: error
          retention-days: 14
      - name: Remove signing files
        if: always()
        run: |
          rm -f frontend/src-tauri/gen/android/keystore.properties "$RUNNER_TEMP/release.p12"

  release:
    name: Publish complete app release
    needs: [plan, native]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: app-*
          path: downloaded
      - name: Validate and gather every platform
        env:
          MATRIX: ${{ needs.plan.outputs.matrix }}
          EXPECTED_VERSION: ${{ needs.plan.outputs.version }}
        run: python .github/scripts/prepare-release.py
      - name: Publish assets through a draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.plan.outputs.tag }}
          TITLE: ${{ needs.plan.outputs.name }} ${{ needs.plan.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/release.json"
          else
            gh release create "$TAG" --verify-tag --draft --title "$TITLE" --generate-notes
          fi
          # A retry may find assets from an interrupted draft upload.
          gh release view "$TAG" --json assets --jq '.assets[].name' > "$RUNNER_TEMP/old-assets"
          while IFS= read -r asset; do
            gh release delete-asset "$TAG" "$asset" --yes
          done < "$RUNNER_TEMP/old-assets"
          gh release upload "$TAG" release-assets/*
          if [[ "$TAG" == *-* ]]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --latest
          fi
          printf 'Published [%s](https://github.com/%s/releases/tag/%s) from `%s`\n' "$TAG" "$GITHUB_REPOSITORY" "$TAG" "$GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  summary:
    name: App delivery summary
    needs: [plan, native, release]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build and publication status
        env:
          PLAN: ${{ needs.plan.result }}
          BUILDS: ${{ needs.native.result }}
          RELEASE: ${{ needs.release.result }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          printf 'Commit: `%s`\n\nVersion: `%s`\n\nPlan: %s\n\nBuilds: %s\n\nPublication: %s\n' "$GITHUB_SHA" "$TAG" "$PLAN" "$BUILDS" "$RELEASE" >> "$GITHUB_STEP_SUMMARY"
