name: zaimu

services:
  app:
    image: oven/bun:latest
    working_dir: /app
    init: true
    volumes:
      - .:/app
    entrypoint: ["sh", "-ec"]
    command:
      - |
        date +%s > /tmp/zaimu-dev-started-at
        echo 0 > /tmp/zaimu-dev-health-failures
        bun install --frozen-lockfile
        bun -F sql contract:emit
        bun -F sql migrate:deploy
        exec bun dev
    develop:
      watch:
        - action: restart
          path: .
          include:
            - backend/src/**
            - frontend/src/**
            - packages/*/src/**
            - packages/sql/migrations/**
            - packages/sql/src/prisma/**
            - packages/sql/prisma.config.ts
    healthcheck:
      test: ["CMD", "sh", "/app/scripts/dev-healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5m
    restart: unless-stopped
    networks:
      - proxy
    labels:
      caddy_1: zaimu.hyoretsu.com
      caddy_1.reverse_proxy: "{{upstreams 3000}}"

      caddy_2: zaimu-api.hyoretsu.com
      caddy_2.reverse_proxy: "{{upstreams 3333}}"

networks:
  proxy:
    external: true
