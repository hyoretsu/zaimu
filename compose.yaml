name: zaimu

services:
  app:
    image: oven/bun:latest
    working_dir: /app
    init: true
    volumes:
      - .:/app
    entrypoint: ["sh", "-ec"]
    command:
      - |
        bun install --frozen-lockfile
        migration_hash=$$(tar -cf - packages/sql/migrations | sha256sum)
        if [ "$$migration_hash" != "$$(cat /tmp/zaimu-migration-hash 2>/dev/null)" ]; then
          bun -F sql migrate:deploy
          printf '%s' "$$migration_hash" > /tmp/zaimu-migration-hash
        fi
        exec bun dev
    develop:
      watch:
        - action: restart
          path: .
          include:
            - backend/src/**
            - frontend/src/**
            - packages/*/src/**
            - packages/sql/migrations/**
    restart: unless-stopped
    networks:
      - proxy
    labels:
      caddy_1: zaimu.hyoretsu.com
      caddy_1.reverse_proxy: "{{upstreams 3000}}"

      caddy_2: zaimu-api.hyoretsu.com
      caddy_2.reverse_proxy: "{{upstreams 3333}}"

networks:
  proxy:
    external: true
