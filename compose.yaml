name: zaimu

x-common: &common
  working_dir: /app
  init: true
  volumes:
    - .:/app

services:
  setup:
    <<: *common
    image: oven/bun:latest
    entrypoint: ["sh", "-c"]
    command: |
      bun install --frozen-lockfile &&
      bun -F sql migrate:deploy
    restart: "no"

  app:
    <<: *common
    image: oven/bun:latest
    entrypoint: ["bun"]
    command: ["dev"]
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - proxy
    labels:
      caddy_1: zaimu.hyoretsu.com
      caddy_1.reverse_proxy: "{{upstreams 3000}}"

      caddy_2: zaimu-api.hyoretsu.com
      caddy_2.reverse_proxy: "{{upstreams 3333}}"

  migrate:
    <<: *common
    image: oven/bun:latest
    environment:
      SHELL: /bin/sh
    entrypoint: ["bunx"]
    command:
      - chokidar-cli
      - "packages/sql/migrations/**/*.{sql,ts}"
      - -c
      - "bun -F sql migrate:deploy"
      - --debounce
      - "750"
    depends_on:
      setup:
        condition: service_completed_successfully
    restart: unless-stopped

networks:
  proxy:
    external: true
