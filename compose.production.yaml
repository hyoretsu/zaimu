x-backend-image: &backend-image ${BACKEND_IMAGE:-ghcr.io/hyoretsu/zaimu_backend:latest}
x-after-migrate: &after-migrate
  depends_on:
    migrate:
      condition: service_completed_successfully

services:
  migrate:
    image: *backend-image
    env_file: .env
    networks:
      - postgres
    restart: "no"
    working_dir: /app/packages/sql
    command: ["bun", "run", "migrate:deploy"]

  backend:
    <<: *after-migrate
    image: *backend-image
    env_file: .env
    networks:
      - postgres
      - proxy
    restart: always
    labels:
      caddy: api.zaimu.me
      caddy.import: cloudflare
      caddy.reverse_proxy: "{{upstreams 3333}}"

  frontend:
    image: ghcr.io/hyoretsu/zaimu_frontend:latest
    env_file: .env
    networks:
      - postgres
      - proxy
    restart: always
    labels:
      caddy: zaimu.me
      caddy.import: cloudflare
      caddy.reverse_proxy: "{{upstreams 3000}}"

  worker:
    <<: *after-migrate
    image: *backend-image
    env_file: .env
    networks:
      - postgres
    restart: always

networks:
  postgres:
    external: true
  proxy:
    external: true
